<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>
	<div class="safe-max-width ion-padding">
		<p><strong>G3 MOCK</strong> — form <code>opportunity</code>. Demo HTML: <code>.cursor/plans/CRM/prototype/index.html</code></p>
		<ion-list>
			<ion-item *ngFor="let i of items" [routerLink]="['/opportunity', i.Id]" button>
				<ion-label>
					<h2>{{ i.Name }}</h2>
					<p>{{ i.Stage }} · {{ i.EventDate }} · {{ i.Hall }} · {{ i.NumberOfGuests }} pax</p>
				</ion-label>
			</ion-item>
		</ion-list>
	</div>
</ion-content>
